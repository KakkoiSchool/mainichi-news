name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test + scheduler (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Unit tests (all 3 scheduler artifacts validated on every OS)
        run: uv run pytest -q

      - name: Scheduler files for every platform render
        shell: bash
        run: |
          for os in linux macos windows; do
            uv run mainichi-news install --print --platform "$os" > /dev/null
          done

      - name: Real scheduler fire (marker command)
        shell: bash
        run: uv run python scripts/firing_test.py --mode fire --yes

      - name: Real scheduler digest run + daily guard
        shell: bash
        run: |
          set +e
          uv run python scripts/firing_test.py --mode digest --yes
          code=$?
          set -e
          if [ "$code" -eq 77 ]; then
            echo "scheduler unavailable on this runner -> skipped"
            exit 0
          fi
          exit "$code"
